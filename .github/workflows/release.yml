name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sedgewright-main-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Calculate release version
        id: version
        shell: bash
        run: |
          version="0.0.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            os: windows
          - runner: macos-26-intel
            rid: osx-x64
            os: macos
          - runner: ubuntu-latest
            rid: linux-x64
            os: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Build Windows release
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          powershell -ExecutionPolicy Bypass -File ./builds/build.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -RuntimeIdentifier win-x64

      - name: Build macOS release
        if: matrix.os == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash builds/build-macos.sh --version "${RELEASE_VERSION}" --rid osx-x64

      - name: Build Linux release
        if: matrix.os == 'linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash builds/build-linux --version "${RELEASE_VERSION}" --rid linux-x64

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/releases/${{ matrix.rid }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release
        uses: actions/download-artifact@v4
        with:
          name: release-win-x64
          path: release-assets/win-x64

      - name: Download macOS release
        uses: actions/download-artifact@v4
        with:
          name: release-osx-x64
          path: release-assets/osx-x64

      - name: Download Linux release
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: release-assets/linux-x64

      - name: Validate platform release assets
        shell: bash
        run: |
          set -euo pipefail

          test_assets() {
            local rid="$1"
            local dir="release-assets/${rid}"

            compgen -G "${dir}/releases.*.json" >/dev/null ||
              { echo "::error::Missing Velopack releases manifest for ${rid}" >&2; exit 1; }
            compgen -G "${dir}/Sedgewright-${{ needs.prepare.outputs.version }}*-full.nupkg" >/dev/null ||
              { echo "::error::Missing Velopack full package for ${rid}" >&2; exit 1; }
          }

          test_assets win-x64
          test_assets osx-x64
          test_assets linux-x64

          compgen -G "release-assets/win-x64/*Setup.exe" >/dev/null ||
            { echo "::error::Missing Windows setup executable" >&2; exit 1; }
          compgen -G "release-assets/osx-x64/Sedgewright-macOS.zip" >/dev/null ||
            { echo "::error::Missing macOS ZIP" >&2; exit 1; }
          compgen -G "release-assets/linux-x64/*.AppImage" >/dev/null ||
            { echo "::error::Missing Linux AppImage" >&2; exit 1; }

          declare -A filenames
          while IFS= read -r -d '' file; do
            filename="$(basename "${file}")"
            if [[ -n "${filenames[$filename]:-}" ]]; then
              echo "::error::Duplicate release asset filename: ${filename}" >&2
              exit 1
            fi
            filenames["${filename}"]=1
          done < <(find release-assets -type f -print0)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Sedgewright ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
