name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sedgewright-main-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Calculate release version
        id: version
        shell: bash
        run: |
          version="0.0.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            os: windows
          - runner: macos-26-intel
            rid: osx-x64
            os: macos
          - runner: ubuntu-latest
            rid: linux-x64
            os: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Build Windows release
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          powershell -ExecutionPolicy Bypass -File ./builds/build.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -RuntimeIdentifier win-x64

      - name: Build macOS release
        if: matrix.os == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash builds/build-macos.sh --version "${RELEASE_VERSION}" --rid osx-x64

      - name: Build Linux release
        if: matrix.os == 'linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash builds/build-linux --version "${RELEASE_VERSION}" --rid linux-x64

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/releases/${{ matrix.rid }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release
        uses: actions/download-artifact@v4
        with:
          name: release-win-x64
          path: release-assets/win-x64

      - name: Download macOS release
        uses: actions/download-artifact@v4
        with:
          name: release-osx-x64
          path: release-assets/osx-x64

      - name: Download Linux release
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: release-assets/linux-x64

      - name: Validate platform release assets
        shell: bash
        run: |
          set -euo pipefail

          test_assets() {
            local rid="$1"
            local dir="release-assets/${rid}"

            compgen -G "${dir}/releases.*.json" >/dev/null ||
              { echo "::error::Missing Velopack releases manifest for ${rid}" >&2; exit 1; }
            compgen -G "${dir}/Sedgewright-${{ needs.prepare.outputs.version }}*-full.nupkg" >/dev/null ||
              { echo "::error::Missing Velopack full package for ${rid}" >&2; exit 1; }
          }

          test_assets win-x64
          test_assets osx-x64
          test_assets linux-x64

          compgen -G "release-assets/win-x64/*Setup.exe" >/dev/null ||
            { echo "::error::Missing Windows setup executable" >&2; exit 1; }
          compgen -G "release-assets/win-x64/Sedgewright-win-Portable.zip" >/dev/null ||
            { echo "::error::Missing Windows portable ZIP" >&2; exit 1; }
          compgen -G "release-assets/osx-x64/Sedgewright-osx-Portable.zip" >/dev/null ||
            { echo "::error::Missing macOS ZIP" >&2; exit 1; }
          unzip -Z1 "release-assets/osx-x64/Sedgewright-osx-Portable.zip" |
            grep -Eq '(^|/)Sedgewright\.app/Contents/Info\.plist$' ||
            { echo "::error::Missing Sedgewright.app bundle in macOS ZIP" >&2; exit 1; }
          compgen -G "release-assets/linux-x64/*.AppImage" >/dev/null ||
            { echo "::error::Missing Linux AppImage" >&2; exit 1; }

          declare -A filenames
          while IFS= read -r -d '' file; do
            filename="$(basename "${file}")"
            if [[ -n "${filenames[$filename]:-}" ]]; then
              echo "::error::Duplicate release asset filename: ${filename}" >&2
              exit 1
            fi
            filenames["${filename}"]=1
          done < <(find release-assets -type f -print0)

      - name: Generate release notes with download links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > release-notes.md

          windows_asset="$(find release-assets/win-x64 -maxdepth 1 -type f -name '*Setup.exe' -print -quit)"
          windows_portable_asset="$(find release-assets/win-x64 -maxdepth 1 -type f -name 'Sedgewright-win-Portable.zip' -print -quit)"
          macos_asset="$(find release-assets/osx-x64 -maxdepth 1 -type f -name 'Sedgewright-osx-Portable.zip' -print -quit)"
          linux_asset="$(find release-assets/linux-x64 -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

          for asset in "$windows_asset" "$windows_portable_asset" "$macos_asset" "$linux_asset"; do
            if [[ -z "$asset" ]]; then
              echo "::error::Unable to find a platform download asset" >&2
              exit 1
            fi
          done

          asset_url() {
            local asset_name
            asset_name="$(basename "$1")"
            printf 'https://github.com/%s/releases/download/%s/%s' \
              "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "$(jq -rn --arg asset "$asset_name" '$asset | @uri')"
          }

          {
            printf '\n\n## Downloads\n\n'
            printf -- '- [Download for Windows (installer)](%s)\n' "$(asset_url "$windows_asset")"
            printf -- '- [Download for Windows (portable ZIP)](%s)\n' "$(asset_url "$windows_portable_asset")"
            printf -- '- [Download for macOS (portable ZIP)](%s)\n' "$(asset_url "$macos_asset")"
            printf -- '- [Download for Linux (AppImage, no install)](%s)\n' "$(asset_url "$linux_asset")"
          } >> release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Sedgewright ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
